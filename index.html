
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Fast client-side autocomplete search"
  />
  <title>Autocomplete Search</title>
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <main class="container">
    <h1>Autocomplete Search</h1>
    <p class="subtitle">
      Search countries by name, even in the middle of a word.
    </p>

    <div class="search-container">
      <label for="search-input">Search</label>

      <div class="input-wrapper">
        <input
          type="text"
          id="search-input"
          placeholder="Try land, cote d'ivoire..."
          autocomplete="off"
          aria-autocomplete="list"
          aria-controls="suggestions"
          aria-expanded="false"
          role="combobox"
        />

        <button id="clear-button" type="button" aria-label="Clear search">
          ×
        </button>
      </div>

      <ul
        id="suggestions"
        class="suggestions"
        role="listbox"
        aria-label="Search suggestions"
        hidden
      ></ul>

      <p id="status" class="status" aria-live="polite"></p>
    </div>

    <p class="hint">
      Use ↑ ↓ to navigate, Enter to select, and Escape to close.
    </p>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
